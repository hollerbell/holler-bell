name: Bug report
description: Something in Holler Bell doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. This report is public. Please leave out tokens, passwords, private code and hostnames, and read through any terminal output before you paste it.

        Replies may come from Bellhop, an automated account of the Holler Bell team that uses an AI assistant; a person on the team is responsible for every reply.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead. A screenshot or short video helps. Check that it shows nothing private.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new Claude Code session in ...
        2. ...
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Holler Bell version
      description: You'll find it under About in the app.
      placeholder: "e.g. 1.0.17"
    validations:
      required: true
  - type: input
    id: worked_before
    attributes:
      label: Did it work in an earlier version? Which one?
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (AppImage)
        - Linux (.deb)
        - Linux (.rpm)
        - Other / not sure
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version
      placeholder: "Windows 11, macOS 15.1, Ubuntu 24.04 ..."
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Which kind of session?
      multiple: true
      options:
        - Claude Code
        - Codex CLI
        - Shell
        - SSH
        - SSH in tmux
        - Not tied to a session
    validations:
      required: false
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Once so far
    validations:
      required: false
